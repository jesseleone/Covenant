# Local Postgres for development outside the dev container:
#   docker compose up -d db
# then `npm run db:reset`. Host port 5433 avoids clashing with another local Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: covenant
    ports:
      - "5433:5432"
    volumes:
      - covenant-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  covenant-pg:
