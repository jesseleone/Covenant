# The Covenant workspace: the app container (where you and Claude Code work)
# and Postgres 16 with the demo data. Used by GitHub Codespaces and by
# VS Code's Dev Containers on a laptop; see devcontainer.json.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    # Share the database container's network, so the app and Postgres are both
    # on "localhost" and Codespaces' port forwarding can reach the app (port
    # 3000). This is the standard setup for Codespaces with a database.
    network_mode: service:db
    volumes:
      - ..:/workspaces/Covenant:cached
      # Linux packages and build output stay inside the container, so a
      # laptop's own copy of the project is never overwritten.
      - node-modules:/workspaces/Covenant/node_modules
      - next-build:/workspaces/Covenant/.next
    environment:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/covenant
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/covenant_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: covenant
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  node-modules:
  next-build:
  postgres-data:
